<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>readnotes</title>
<meta name="description" content="A reading shelf and margin ledger: track where you are in every book and keep one note per page — sorted for you, stored on your machine.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='6' width='24' height='20' rx='2' fill='%23b23a2b'/%3E%3Cpath d='M16 9v14M16 9c-2.2-1.4-5.2-1.5-8-.6V22c2.8-.9 5.8-.8 8 .6V9z' fill='%23f6f1e6'/%3E%3Cpath d='M16 9c2.2-1.4 5.2-1.5 8-.6V22c-2.8-.9-5.8-.8-8 .6V9z' fill='%23ebe3d0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!--
readnotes · direction contract
THESIS: A reader's shelf and margin ledger. It refuses the generic notes-app arrangement — big white input, flat list, progress as a side widget. Here progress and note-taking are one mechanic, the page number the single source of truth.
OWN-WORLD: Warm paper ground with ruled ink hairlines; every book is a cloth-bound spine carrying a paper title plate; reading progress is a bookmark ribbon — notch, tassel, ribbon-red — and notes sit in a ledger ruled like a book's margins, folio page numbers set in monospace. Spectral serif for reading, IBM Plex Mono for measure. Two faces, one accent.
STORY: The reader's books stand on a cloth shelf. Opening one, a ribbon shows how far they have read; the margin ledger waits below, already in page order. Writing a note at a page marks that page read.
FIRST VIEWPORT: The shelf. A ruled grid of cloth spines, the readnotes wordmark with a single ribbon mark, and one primary action, Add book. Every cover carries its title plate, status stamp, and a trimmed ribbon with page and percent.
FORM: code-led single-page shell, two views hash-routed, generated cloth covers, bookmark-ribbon readout. Direction pinned by the user — warm, bookish, minimal — so no concept roll.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->

<svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="display:none">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-chev-left" viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20l.9-4.2L16.5 4.2a2 2 0 0 1 2.8 0l.5.5a2 2 0 0 1 0 2.8L8.2 19.1z"/><path d="M14.5 6.2l3.3 3.3"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6.5 7l.8 12h9.4l.8-12M10 11v5M14 11v5"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.4"/><path d="M5 17l4.5-4.5 3 3 3-3 3.5 3.5"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v11M7.5 11.5L12 16l4.5-4.5M5 19h14"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 19h14"/></symbol>
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M12 6.5C10 5 6.5 4.6 4 5.4v12c2.5-.8 6-.4 8 1.1v-12zM12 6.5c2-1.5 5.5-1.9 8-1.1v12c-2.5-.8-6-.4-8 1.1v-12z"/></symbol>
</svg>

<header class="appbar" aria-label="App header">
  <a class="wordmark" href="#/" onclick="App.gotoLibrary(event)">readnotes<span class="mark" aria-hidden="true"></span></a>
  <div class="appbar-actions">
    <button class="btn ghost" type="button" data-act="export"><svg class="ic"><use href="#i-download"/></svg><span class="label">Export</span></button>
    <button class="btn ghost" type="button" data-act="import"><svg class="ic"><use href="#i-upload"/></svg><span class="label">Import</span></button>
    <input id="import-file" type="file" accept=".json,application/json" hidden>
    <button class="btn primary" type="button" data-act="new-book"><svg class="ic"><use href="#i-plus"/></svg><span class="label">Add book</span></button>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<dialog id="book-dialog" aria-labelledby="book-dialog-title">
  <form method="dialog" id="book-form" novalidate>
    <div class="dialog-head">
      <h2 id="book-dialog-title" class="dialog-title">Add a book</h2>
      <button class="iconbtn" type="button" value="cancel" data-act="close-dialog" aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
    </div>
    <label class="field">
      <span class="field-label">Title</span>
      <input name="title" type="text" required maxlength="120" autocomplete="off" placeholder="e.g. The Name of the Wind">
    </label>
    <label class="field">
      <span class="field-label">Author</span>
      <input name="author" type="text" maxlength="80" autocomplete="off" placeholder="e.g. Patrick Rothfuss">
    </label>
    <div class="field-row">
      <label class="field">
        <span class="field-label">Total pages</span>
        <input name="totalPages" type="number" inputmode="numeric" min="1" max="50000" required placeholder="e.g. 662">
      </label>
      <label class="field">
        <span class="field-label">Current page</span>
        <input name="startPage" type="number" inputmode="numeric" min="0" max="50000" value="0">
      </label>
    </div>
    <label class="field">
      <span class="field-label">Status</span>
      <select name="status">
        <option value="reading">Reading</option>
        <option value="finished">Finished</option>
        <option value="dropped">Dropped</option>
      </select>
    </label>
    <div class="dialog-actions">
      <button class="btn ghost" type="button" data-act="close-dialog">Cancel</button>
      <button class="btn primary" type="submit" value="default">Add book</button>
    </div>
  </form>
</dialog>

<dialog id="confirm-dialog" aria-labelledby="confirm-title">
  <div class="dialog-body">
    <h2 id="confirm-title" class="dialog-title">Delete this?</h2>
    <p id="confirm-message" class="confirm-message"></p>
    <div class="dialog-actions">
      <button class="btn ghost" type="button" data-act="confirm-no">Keep it</button>
      <button class="btn danger" type="button" data-act="confirm-yes">Delete</button>
    </div>
  </div>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
